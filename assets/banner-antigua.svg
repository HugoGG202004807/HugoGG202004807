<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2550"/>
      <stop offset=".5" stop-color="#6b4a82"/>
      <stop offset=".8" stop-color="#c9667a"/>
      <stop offset="1" stop-color="#f2a07b"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd9a8" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffd9a8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="r"><rect width="1000" height="300" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1000" height="300" fill="url(#sky)"/>
    <!-- estrellas -->
    <g fill="#fff" opacity=".8">
      <circle cx="80" cy="30" r="1.5"/><circle cx="190" cy="55" r="1"/><circle cx="310" cy="25" r="1.5"/>
      <circle cx="420" cy="60" r="1"/><circle cx="520" cy="28" r="1.5"/><circle cx="610" cy="50" r="1"/>
      <circle cx="930" cy="35" r="1.5"/><circle cx="880" cy="70" r="1"/><circle cx="140" cy="95" r="1"/>
    </g>
    <!-- resplandor del atardecer -->
    <circle cx="760" cy="220" r="170" fill="url(#glow)"/>
    <!-- Volcán de Agua -->
    <path d="M430 300 L690 130 Q700 112 718 108 L802 108 Q820 112 830 130 L1060 300 Z" fill="#3a2a5c"/>
    <path d="M560 300 L700 170 L760 140 L840 175 L980 300 Z" fill="#2a1f47" opacity=".75"/>
    <!-- casas y tejados de Antigua -->
    <g fill="#160f2b">
      <rect x="600" y="262" width="46" height="38"/><path d="M594 262 L623 244 L652 262 Z"/>
      <rect x="652" y="270" width="40" height="30"/><path d="M646 270 L672 254 L698 270 Z"/>
      <rect x="720" y="266" width="50" height="34"/><path d="M714 266 L745 248 L776 266 Z"/>
      <rect x="930" y="264" width="46" height="36"/><path d="M924 264 L953 246 L982 264 Z"/>
      <rect x="560" y="276" width="40" height="24"/>
      <rect x="976" y="272" width="30" height="28"/>
      <!-- Arco de Santa Catalina con torre del reloj -->
      <rect x="800" y="214" width="110" height="86"/>
      <rect x="835" y="168" width="40" height="50"/>
      <path d="M829 170 L855 148 L881 170 Z"/>
      <rect x="852" y="136" width="6" height="14"/>
    </g>
    <!-- arco abierto y reloj -->
    <path d="M830 300 V262 A25 25 0 0 1 880 262 V300 Z" fill="#f2a07b" opacity=".55"/>
    <circle cx="855" cy="190" r="9" fill="#ffd9a8"/>
    <path d="M855 184 V190 H860" stroke="#160f2b" stroke-width="1.5" fill="none"/>
    <!-- texto -->
    <text x="60" y="118" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#fff">Hugo Girón</text>
    <text x="62" y="152" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" letter-spacing="5" fill="#ffe6cf">FULL STACK DEVELOPER</text>
    <text x="62" y="176" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#ffd9c0">desde Sacatepéquez, Guatemala</text>
    <!-- tarjeta de código -->
    <rect x="60" y="200" width="400" height="58" rx="10" fill="#120c26" opacity=".72"/>
    <g font-family="Consolas, 'Courier New', monospace" font-size="13">
      <text x="76" y="224" fill="#c9a7e8">Route::get(<tspan fill="#ffd9a8">'/antigua'</tspan>, fn () =&gt;</text>
      <text x="76" y="244" fill="#ffd9a8">   'hecho con cariño'<tspan fill="#c9a7e8">);</tspan></text>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
